services:
  api:
    build:
      context: .
      dockerfile: src/MyMoola.API/Dockerfile
    container_name: mymoola-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=MyMoola;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env};
      - Jwt__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in backend/.env}
      - Jwt__Issuer=MyMoola
      - Jwt__Audience=MyMoolaUsers
      - Jwt__ExpiryMinutes=15
      - AdminJwt__SecretKey=${ADMIN_JWT_SECRET_KEY:?Set ADMIN_JWT_SECRET_KEY in backend/.env}
      - AdminJwt__Issuer=MyMoola-Admin
      - AdminJwt__Audience=MyMoolaAdmins
      - AdminJwt__ExpiryMinutes=60
      - Crypto__HdWalletSeedPhrase=${CRYPTO_HD_WALLET_SEED_PHRASE:?Set CRYPTO_HD_WALLET_SEED_PHRASE in backend/.env}
      - Crypto__HotWalletAddress=${CRYPTO_HOT_WALLET_ADDRESS:?Set CRYPTO_HOT_WALLET_ADDRESS in backend/.env}
      - Crypto__TreasuryAddress=${CRYPTO_TREASURY_ADDRESS:?Set CRYPTO_TREASURY_ADDRESS in backend/.env}
      - Redis__ConnectionString=redis:6379
      - Redis__IdempotencyDatabase=6
      - AfricasTalking__Username=sandbox
      - AfricasTalking__ApiKey=${AFRICASTALKING_API_KEY:?Set AFRICASTALKING_API_KEY in backend/.env}
      - AfricasTalking__SenderId=
      - AfricasTalking__BaseUrl=https://api.sandbox.africastalking.com/
      - Email__ResendApiKey=${RESEND_API_KEY:?Set RESEND_API_KEY in backend/.env}
      - Email__FromAddress=onboarding@resend.dev
      - Email__FromName=MyMoola
      - ExternalApis__CoinGeckoApiKey=${COINGECKO_API_KEY:?Set COINGECKO_API_KEY in backend/.env}
      - ExternalApis__Binance__BaseUrl=https://api.binance.com
      - ExternalApis__Binance__TimeoutSeconds=15
      - ExternalApis__CoinGecko__BaseUrl=https://api.coingecko.com
      - ExternalApis__CoinGecko__TimeoutSeconds=20
      - ExternalApis__ForexBaseUrl=https://open.er-api.com
      - ExternalApis__RateRefreshIntervalMinutes=1
      - ExternalApis__RateStalenessThresholdMinutes=5
      - ExternalApis__SpreadPercent=1.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mymoola-network

  postgres:
    image: postgres:16-alpine
    container_name: mymoola-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=MyMoola
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d MyMoola"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mymoola-network

  redis:
    image: redis:7-alpine
    container_name: mymoola-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mymoola-network

volumes:
  postgres-data:
  redis-data:

networks:
  mymoola-network:
    driver: bridge
